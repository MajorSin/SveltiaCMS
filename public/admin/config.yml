# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: MajorSin/SveltiaCMS

media_folder: /public/media
public_folder: /media

collections:
  - name: steps
    label: Steps
    label_singular: Steps
    folder: /content/steps
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: string }

singletons:
  - name: home
    label: Home Page
    file: content/home.yaml
    fields:
      - { label: Title, name: title }
      - { label: Body, name: body, widget: richtext }
      - { label: "Banner", "name": "image", "widget": "image" }
